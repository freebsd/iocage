---

name: Release (reusable)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      token:
        required: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}
          path: iocage-${{ inputs.version }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: "Build documentation"
        working-directory: iocage-${{ inputs.version }}
        run: |
          python -m pip install -r requirements-doc.txt
          python -m sphinx -W \
            -D version=${{ inputs.version }} \
            -D release=${{ inputs.version }} \
            -b html doc/source docs
      - uses: ksm2/archive-action@v1
        env:
          # node20 is deprecated, force node24 until
          # the action is updated (there is still a warning)
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          format: "tar.gz"
          name: "iocage-${{ inputs.version }}"
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.version }}
          artifacts: "iocage-${{ inputs.version }}.tar.gz"
          generateReleaseNotes: true
          draft: true
          # bodyFile: "body.md"
