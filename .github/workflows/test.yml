---

name: Test

on: [push, pull_request]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install -r requirements.txt
      - name: Unit test
        run: pytest tests/unit_tests
      - name: Collect functional tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          # Check standard Python without setuptools' distutils replacement.
          SETUPTOOLS_USE_DISTUTILS: stdlib
        run: python -m pytest --collect-only tests/functional_tests -o addopts=
      - name: Upload coverage
        run: |
          python -m pip install 'coveralls>=4.1.0'
          coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint with flake8
        run: ./flake8.sh
      - name: "Check sphinx build"
        uses: ammaraskar/sphinx-action@master
        with:
          docs-folder: "doc/source"
          build-command: "sphinx-build -b html . ../../docs"
