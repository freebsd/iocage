[project]
name = "iocage"
version = "1.13"
description = "A jail manager that uses ZFS."
authors = [
    {name = "iocage Contributors",email = "ports@FreeBSD.org"},
]
keywords = ["freebsd", "jail", "jail manager", "zfs"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: BSD :: FreeBSD",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15"
]
# Archive extraction requires the tarfile filters added in Python 3.11.4.
requires-python = ">=3.11.4"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]

dependencies = [
    "click>=8.3.1",
    "coloredlogs>=9.0",
    "requests>=2.18.4",
    "texttable>=1.2.1",
    "netifaces>=0.10.8",
    "GitPython>=2.1.11",
    "dnspython>=2.0.0",
    "jsonschema>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/freebsd/iocage"

[project.scripts]
iocage = "iocage_cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iocage_cli", "iocage_lib"]
exclude = ["*.orig"]

[tool.hatch.build.targets.wheel.shared-data]
"rc.d/iocage" = "etc/rc.d/iocage"
"iocage.8" = "share/man/man8/iocage.8"
"zsh-completion/_iocage" = "share/zsh/site-functions/_iocage"

[tool.hatch.build.targets.sdist]
include = [
    "iocage_cli/*.py",
    "iocage_lib/*.py",
    "iocage_lib/plugin_manifest.json",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "rc.d/iocage",
    "iocage.8",
    "zsh-completion/_iocage"
]
exclude = ["*.orig"]
